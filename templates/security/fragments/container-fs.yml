name: container-scan
needs: scope
if: needs.scope.outputs.tier != 'docs'
runs-on: {{runner}}
timeout-minutes: 15
steps:
  - name: Check out
    uses: {{checkout}}
    with:
      persist-credentials: "false"
  - id: bypass
    name: Apply a registered bypass
    env:
      SECURITY_BYPASS: "${{ vars.SECURITY_BYPASS }}"
      SECURITY_BYPASS_MAX_DAYS: "{{bypass_max_days}}"
    run: |
      set -- container-scan
{{bypass_variable}}
  - name: Install trivy
    if: steps.bypass.outputs.id == ''
    env:
{{trivy_env}}
    run: |
{{install_tool}}
  - name: Scan the filesystem and the configuration with trivy
    if: steps.bypass.outputs.id == ''
    env:
      SEVERITY: "{{severity}}"
    run: |
      trivy --version
      trivy fs --scanners vuln,misconfig --exit-code 1 --severity "$SEVERITY" --ignorefile .trivyignore.yaml .
      trivy config --exit-code 1 --severity "$SEVERITY" --ignorefile .trivyignore.yaml .
  - name: Scan for secrets with trivy, locations only
    if: steps.bypass.outputs.id == ''
    env:
      SEVERITY: "{{severity}}"
    run: |
      status=0
      trivy fs --scanners secret --exit-code 1 --severity "$SEVERITY" --ignorefile .trivyignore.yaml --format json --output trivy-secrets.json . || status=$?
      set -- trivy trivy-secrets.json "$status"
{{scanner_findings}}
