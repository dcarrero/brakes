name: {{name}}
# Generated by brakes ci-baseline {{version}} from .agent-setup/project.json and
# .agent-setup/modules/ci-baseline.json. Edit those and re-run the installer; a hand
# edit here is refused as a conflict. Commands are read at run time, never invented.
# Pinned by SHA; when GitHub's workflow lockfile leaves preview, `gh actions-lock`
# supersedes these pins (decision pending).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [{{default_branch}}]
  workflow_dispatch:
{{merge_group}}permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
