name: Reusable verify
# Generated by brakes ci-baseline {{version}} (SPEC-ci-baseline.md, "Reusable
# workflow"): the setup comes from the stack packs and every pin from the shared table,
# so a test fails when this file and its render differ (UPDATE_GOLDENS=1 rewrites it).
# Callers keep scope, workflow-lint and required; this runs their declared commands.
on:
  workflow_call:
    inputs:
      commands:
        description: JSON array of lint, test, verify and build, in run order.
        type: string
        required: true
      profile-path:
        description: Where the commands are declared, relative to working-directory.
        type: string
        default: .agent-setup/project.json
      working-directory:
        description: The app directory, relative to the checkout.
        type: string
        default: .
      stack:
        description: The stack pack whose setup runs (rust, python-uv, node, go).
        type: string
        required: true
      runs-on:
        description: The runner label, JSON-quoted; one of the labels the installer renders.
        type: string
        default: {{default_label}}
      tier:
        description: The caller's tier (full or docs); the callee never filters paths.
        type: string
        required: true
    outputs:
      result:
        description: The verify job's status (success, failure or cancelled).
        value: ${{ jobs.verify.outputs.result }}
permissions:
  contents: read
jobs:
  verify:
    name: verify
    if: inputs.tier != 'docs'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
