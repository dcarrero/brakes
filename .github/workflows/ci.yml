# The tool's own checks on GitHub-hosted runners: lint, and the test suite. The
# required check is `required`, one stable name over every job. The repository's
# own ci-baseline render replaces this workflow once it installs itself.
# `neutrality`, which the aggregate also needs, checks the forbidden tokens, keyed
# (neutrality/forbidden.hmac), over the tree, its paths and every commit message. It
# fails closed without the NEUTRALITY_HMAC_KEY secret (so on pull requests from forks)
# and never prints the key or a token.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: Rust lint (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
  test:
    name: Rust test (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          toolchain: 1.99.0
      - name: Test
        run: cargo test --locked
  neutrality:
    name: neutrality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          toolchain: 1.99.0
      - name: Check forbidden tokens
        env:
          NEUTRALITY_HMAC_KEY: ${{ secrets.NEUTRALITY_HMAC_KEY }}
        run: cargo test --locked --test neutrality -- --include-ignored
  required:
    name: required
    if: always()
    needs: [lint, test, neutrality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.lint.result }} ${{ needs.test.result }} ${{ needs.neutrality.result }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "required failed: results are $RESULTS"; exit 1
            fi
          done
          echo "Lint, tests and neutrality passed."
