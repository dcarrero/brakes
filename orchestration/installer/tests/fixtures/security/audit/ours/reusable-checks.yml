name: Declared project checks
on:
  workflow_call:
    inputs:
      verify-command:
        type: string
        required: true
      setup-command:
        type: string
        default: ''
      contract-command:
        type: string
        default: ''
      working-directory:
        type: string
        default: '.'
      python-version:
        type: string
        default: ''
      rust-version:
        type: string
        default: ''
      runs-on:
        description: JSON runner label or list of labels.
        type: string
        default: '"ubuntu-latest"'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: inputs.python-version != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
      - if: inputs.rust-version != ''
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          toolchain: ${{ inputs.rust-version }}
      - name: Prepare declared environment
        if: inputs.setup-command != ''
        env:
          DECLARED_COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$DECLARED_COMMAND"
      - name: Verify declared checks
        env:
          DECLARED_COMMAND: ${{ inputs.verify-command }}
        run: |
          test -n "$DECLARED_COMMAND"
          bash -euo pipefail -c "$DECLARED_COMMAND"
      - name: Verify declared contracts
        if: inputs.contract-command != ''
        env:
          DECLARED_COMMAND: ${{ inputs.contract-command }}
        run: bash -euo pipefail -c "$DECLARED_COMMAND"
