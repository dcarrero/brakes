name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    uses: ./.github/workflows/reusable-checks.yml
    with:
      python-version: '3.10'
      rust-version: '1.99.0'
      runs-on: '"example-linux-2-arm"'
      verify-command: |
        cargo test --locked
        python3 -m unittest discover -s tests -v
        git diff --check
      contract-command: make contract
