# brakes stack-packs: action pins for Dependabot's `github-actions` ecosystem.
# Never runs (manual trigger only, every job gated off). One `uses:` per action of
# templates/stack-packs/pins.json that no other workflow here uses; the pins test
# (orchestration/installer/tests/stack_packs_pins.rs) fails until a bump here is
# copied into pins.json with a new `last_verified`.
name: Stack-pack pins
on:
  workflow_dispatch:
permissions: {}
jobs:
  pins:
    name: pins (never runs)
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pins
          key: pins
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pins
          key: pins
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
