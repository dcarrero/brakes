name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests run on hosted runners, never on the deploy host, and not on drafts.
  changes:
    name: changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      portal: ${{ steps.filter.outputs.portal }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      backend_code: ${{ steps.filter.outputs.backend_code }}
      portal_code: ${{ steps.filter.outputs.portal_code }}
      web_code: ${{ steps.filter.outputs.web_code }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'infra/docker-compose.yml'
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'infra/deploy/docker-compose.prod.yml'
            portal:
              - 'apps/portal/**'
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'infra/deploy/docker-compose.prod.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'infra/deploy/docker-compose.prod.yml'
            e2e:
              - 'apps/web/**'
              - 'apps/backend/**'
              - '.github/workflows/ci.yml'
              - 'Makefile'
            backend_code:
              - 'apps/backend/**'
              - 'infra/deploy/docker-compose.prod.yml'
            portal_code:
              - 'apps/portal/**'
              - 'infra/deploy/docker-compose.prod.yml'
            web_code:
              - 'apps/web/**'
              - 'infra/deploy/docker-compose.prod.yml'
            infra:
              - 'infra/deploy/**'
              - '.github/workflows/ci.yml'

  # Three shards; pytest-split balances them by the recorded test durations.
  backend:
    name: backend ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      COMPOSE_PROJECT_NAME: example-api-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@127.0.0.1:15433/app
      PYTEST_ADDOPTS: --splits 3 --group ${{ matrix.shard }} --splitting-algorithm least_duration
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - run: make lint-backend
      - run: make test-backend
      - if: always()
        run: make down-backend

  portal:
    name: portal
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make test-portal
      - run: make build-portal

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make test-web
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - name: Backend environment for the browser tests
        run: cd apps/backend && uv sync --frozen
      - name: Chromium for the browser tests
        run: cd apps/web && npx playwright install --with-deps chromium
      - name: Browser tests
        run: cd apps/web && npm run test:browser
      - run: make build-web

  # Critical journey: the web app and the real API in Docker, Playwright only.
  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: example-api-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd apps/web && npm ci
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: docker compose -f apps/web/e2e-critical/compose.yml up -d --build --wait db api
      - run: docker compose -f apps/web/e2e-critical/compose.yml exec -T api alembic upgrade head
      - name: Seed data (the API needs one account)
        run: echo synthetic-secret | docker compose -f apps/web/e2e-critical/compose.yml exec -T api python -m src.accounts.commands.seed --email e2e@example.test
      - run: cd apps/web && npx playwright test --config e2e-critical/critical.config.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: docker compose -f apps/web/e2e-critical/compose.yml down -v

  ios:
    name: ios
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make test-ios

  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/deploy/tests/run-all.sh

  deploy-backend:
    name: deploy-backend
    needs: [changes, backend]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend_code == 'true' && needs.backend.result == 'success'
    runs-on: [self-hosted, Linux, deploy]
    environment: production
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: bash apps/backend/deploy/deploy.sh
      - run: python3 scripts/ci/deploy_finished.py backend

  deploy-portal:
    name: deploy-portal
    needs: [changes, portal, deploy-backend]
    if: |
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.portal_code == 'true' && needs.portal.result == 'success'
    runs-on: [self-hosted, Linux, deploy]
    environment: production
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: bash apps/portal/deploy/deploy.sh
      - run: python3 scripts/ci/deploy_finished.py portal

  deploy-web:
    name: deploy-web
    needs: [changes, web, deploy-backend, deploy-portal]
    if: |
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend_code != 'true' || needs.deploy-backend.result == 'success') &&
      needs.changes.outputs.web_code == 'true' && needs.web.result == 'success'
    runs-on: [self-hosted, Linux, deploy]
    environment: production
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: bash apps/web/deploy/deploy.sh
      - run: python3 scripts/ci/deploy_finished.py web

  # Human visual gate: a PR that changes the UI needs `visual:approved`
  # (with screenshots) or `visual:n/a`, set by a maintainer.
  visual-gate:
    name: visual-gate
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/visual_gate.py
        env:
          GH_TOKEN: ${{ github.token }}

  all-checks-passed:
    name: all-checks-passed
    needs: [changes, backend, portal, web, e2e, ios, infra, visual-gate]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/ci
      - run: python3 scripts/ci/all_checks_passed.py
        env:
          NEEDS: ${{ toJSON(needs) }}
          PR_DRAFT: ${{ github.event.pull_request.draft == true }}
